<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>OG Image Template</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    /*
     * 1200×630px Open-Graph-Bild für Social-Shares.
     * Anleitung: diese Datei im Browser öffnen, Viewport auf 1200×630
     * stellen (Dev-Tools → Responsive 1200×630), Vollbild-Screenshot,
     * als og-image.png im Repo-Root speichern.
     */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: linear-gradient(135deg, #FAFAFA 0%, #F0F0F0 100%);
    }
    .card {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      padding: 80px;
      gap: 80px;
    }
    .left {
      flex: 1;
    }
    .wordmark {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.2px;
      color: #0A0A0F;
      margin-bottom: 32px;
      display: inline-flex;
      align-items: center;
    }
    .wordmark .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #3DBF84;
      border-radius: 50%;
      margin: 0 4px;
      position: relative;
      top: -4px;
    }
    .headline {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 84px;
      line-height: 1.0;
      letter-spacing: -2.5px;
      color: #0A0A0F;
      margin-bottom: 24px;
    }
    .sub {
      font-size: 24px;
      color: #555;
      line-height: 1.4;
      margin-bottom: 32px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #3DBF84;
      color: white;
      padding: 14px 22px;
      border-radius: 100px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .right {
      width: 320px;
      height: 480px;
      background: #1A1A1A;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.2);
    }
    .screen {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 32px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
    }
    .greet-label {
      font-size: 11px;
      font-weight: 700;
      color: #999;
      letter-spacing: 1.4px;
      margin-bottom: 8px;
    }
    .greet {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin-bottom: 20px;
    }
    .hero-card {
      background: linear-gradient(135deg, #FF8A5B, #FF6B9D);
      border-radius: 20px;
      padding: 18px;
      color: white;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(255,107,91,0.25);
    }
    .hero-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.3px;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .hero-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .hero-sub {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .hero-pill {
      display: inline-block;
      background: #3DBF84;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat {
      background: white;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .stat-val { font-size: 18px; font-weight: 800; }
    .stat-lbl { font-size: 10px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="wordmark">Crush<span class="dot"></span>It</div>
      <h1 class="headline">Bestehe deine<br>Prüfung mit KI.</h1>
      <p class="sub">Zusammenfassungen, Karteikarten,<br>Prüfungssimulationen — automatisch.</p>
      <span class="pill">7 Tage kostenlos testen →</span>
    </div>
    <div class="right">
      <div class="screen">
        <div class="greet-label">DI, 22. MAI</div>
        <div class="greet">Guten Tag, Martin 👋</div>
        <div class="hero-card">
          <div class="hero-label">NÄCHSTE PRÜFUNG</div>
          <div class="hero-title">Zivilrecht II</div>
          <div class="hero-sub">in 11 Tagen</div>
          <span class="hero-pill">Weiterlernen →</span>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-val">12</div><div class="stat-lbl">Dokumente</div></div>
          <div class="stat"><div class="stat-val">347</div><div class="stat-lbl">Karten</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
